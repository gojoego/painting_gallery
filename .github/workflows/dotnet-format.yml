name: .NET Format Check

on:
  pull_request:
    branches:
      - main


jobs:

  format:

    runs-on: ubuntu-latest


    steps:

    - uses: actions/checkout@v4


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x


    - name: Check formatting
      run: dotnet format --verify-no-changes